  <circle cx="65.28" cy="77" r="5.0" fill="none" stroke="#5a2f1e" stroke-width="0.28"/>

  <!-- Divider between mod row and IN -->
  <line x1="3" y1="87.5" x2="78.28" y2="87.5" stroke="url(#chromeH)" stroke-width="0.18"/>
  <line x1="3" y1="88.0" x2="78.28" y2="88.0" stroke="#000000" stroke-width="0.12" opacity="0.9"/>

