  <circle cx="28.64" cy="52" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>
  <circle cx="52.64" cy="52" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>

