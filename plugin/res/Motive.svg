  <line x1="6" y1="67.5" x2="75.28" y2="67.5" stroke="#2a2925" stroke-width="0.1"/>
  <rect x="2" y="69.5" width="77.28" height="15.5" rx="1.0" ry="1.0" fill="#0e1013" opacity="0.55"/>
  <rect x="2" y="69.5" width="77.28" height="15.5" rx="1.0" ry="1.0" fill="none" stroke="#252a30" stroke-width="0.15"/>

  <circle cx="16.00" cy="77" r="5.0" fill="none" stroke="#2f3540" stroke-width="0.28"/>
