  <circle cx="52.00" cy="97" r="5.2" fill="none" stroke="#2a3340" stroke-width="0.28"/>
  <circle cx="72.00" cy="97" r="5.2" fill="none" stroke="#2a3340" stroke-width="0.28"/>

  <!-- Full-width rust divider between IN and OUT -->
