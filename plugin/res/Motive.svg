  <rect x="2" y="109.0" width="77.28" height="15.0" rx="1.2" ry="1.2" fill="none" stroke="#3a221a" stroke-width="0.18"/>

  <circle cx="10.50" cy="117" r="5.2" fill="none" stroke="#5a2f1e" stroke-width="0.28"/>
  <circle cx="30.00" cy="117" r="5.2" fill="none" stroke="#5a2f1e" stroke-width="0.28"/>
  <circle cx="52.00" cy="117" r="5.2" fill="none" stroke="#5a2f1e" stroke-width="0.28"/>
  <circle cx="72.00" cy="117" r="5.2" fill="none" stroke="#5a2f1e" stroke-width="0.28"/>

  <line x1="3" y1="125.6" x2="78.28" y2="125.6" stroke="url(#chromeH)" stroke-width="0.18"/>
  <line x1="3" y1="126.1" x2="78.28" y2="126.1" stroke="#000000" stroke-width="0.12" opacity="0.9"/>
