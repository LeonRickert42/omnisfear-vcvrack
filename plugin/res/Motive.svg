<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="71.12mm" height="128.5mm" viewBox="0 0 71.12 128.5">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="128.5" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#0a0a0e"/>
      <stop offset="0.35" stop-color="#0f0f14"/>
      <stop offset="0.7"  stop-color="#101015"/>
      <stop offset="1"    stop-color="#16161c"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#7a3418"/>
      <stop offset="0.5"  stop-color="#c8582a"/>
      <stop offset="1"    stop-color="#7a3418"/>
    </linearGradient>
    <linearGradient id="chromeH" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#24231e"/>
      <stop offset="0.5"  stop-color="#8a8880"/>
      <stop offset="1"    stop-color="#24231e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="71.12" height="128.5" fill="url(#bgGrad)"/>

  <!-- Top double chrome hairline -->
  <line x1="3" y1="3.4" x2="68.12" y2="3.4" stroke="url(#chromeH)" stroke-width="0.18"/>
  <line x1="3" y1="3.9" x2="68.12" y2="3.9" stroke="#000000" stroke-width="0.12" opacity="0.9"/>

  <!-- Rust brand bar under title area -->
  <rect x="27.56" y="16.9" width="16" height="0.6" fill="url(#rustGrad)"/>

  <!-- Sub-hairline under subtitle -->
  <line x1="6" y1="23.5" x2="65.12" y2="23.5" stroke="#3a3934" stroke-width="0.1"/>

  <!-- Knob row 1 rust corner marks -->
  <circle cx="3.2"   cy="28" r="0.5" fill="#c8582a"/>
  <circle cx="67.92" cy="28" r="0.5" fill="#c8582a"/>

  <!-- Faint decorative rings behind row-1 knobs -->
  <circle cx="14.0"  cy="28" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>
  <circle cx="35.56" cy="28" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>
  <circle cx="57.12" cy="28" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>

  <!-- Knob row 2 rust corner marks -->
  <circle cx="3.2"   cy="52" r="0.5" fill="#c8582a"/>
  <circle cx="67.92" cy="52" r="0.5" fill="#c8582a"/>

  <circle cx="24.78" cy="52" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>
  <circle cx="46.34" cy="52" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>

  <!-- Divider between control area and signal area -->
  <line x1="3" y1="74.5" x2="68.12" y2="74.5" stroke="url(#chromeH)" stroke-width="0.18"/>
  <line x1="3" y1="75.0" x2="68.12" y2="75.0" stroke="#000000" stroke-width="0.12" opacity="0.9"/>

  <!-- Small rust tick between IN and OUT sections -->
  <rect x="30.56" y="106.8" width="10" height="0.5" fill="url(#rustGrad)"/>

  <!-- Faint rings behind input jacks -->
  <circle cx=" 9.0" cy="95"  r="5.2" fill="none" stroke="#1c1b17" stroke-width="0.2"/>
  <circle cx="24.0" cy="95"  r="5.2" fill="none" stroke="#1c1b17" stroke-width="0.2"/>
  <circle cx="39.0" cy="95"  r="5.2" fill="none" stroke="#1c1b17" stroke-width="0.2"/>
  <circle cx="54.0" cy="95"  r="5.2" fill="none" stroke="#1c1b17" stroke-width="0.2"/>

  <!-- Faint rings behind output jacks (warmer tone) -->
  <circle cx=" 9.0" cy="115" r="5.2" fill="none" stroke="#3a221a" stroke-width="0.2"/>
  <circle cx="24.0" cy="115" r="5.2" fill="none" stroke="#3a221a" stroke-width="0.2"/>
  <circle cx="39.0" cy="115" r="5.2" fill="none" stroke="#3a221a" stroke-width="0.2"/>
  <circle cx="54.0" cy="115" r="5.2" fill="none" stroke="#3a221a" stroke-width="0.2"/>

  <!-- Bottom double chrome hairline -->
  <line x1="3" y1="125.6" x2="68.12" y2="125.6" stroke="url(#chromeH)" stroke-width="0.18"/>
  <line x1="3" y1="126.1" x2="68.12" y2="126.1" stroke="#000000" stroke-width="0.12" opacity="0.9"/>
</svg>
