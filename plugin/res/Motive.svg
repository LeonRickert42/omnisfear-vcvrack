<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="81.28mm" height="128.5mm" viewBox="0 0 81.28 128.5">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="128.5" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#0a0a0e"/>
      <stop offset="0.35" stop-color="#0f0f14"/>
      <stop offset="0.7"  stop-color="#101015"/>
      <stop offset="1"    stop-color="#16161c"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#7a3418"/>
      <stop offset="0.5"  stop-color="#c8582a"/>
      <stop offset="1"    stop-color="#7a3418"/>
    </linearGradient>
    <linearGradient id="chromeH" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#24231e"/>
      <stop offset="0.5"  stop-color="#8a8880"/>
      <stop offset="1"    stop-color="#24231e"/>
    </linearGradient>
  </defs>

  <rect width="81.28" height="128.5" fill="url(#bgGrad)"/>

  <line x1="3" y1="3.4" x2="78.28" y2="3.4" stroke="url(#chromeH)" stroke-width="0.18"/>
  <line x1="3" y1="3.9" x2="78.28" y2="3.9" stroke="#000000" stroke-width="0.12" opacity="0.9"/>

  <rect x="33.64" y="20.2" width="14" height="0.7" fill="url(#rustGrad)"/>

  <line x1="6" y1="25.0" x2="75.28" y2="25.0" stroke="#3a3934" stroke-width="0.1"/>

  <circle cx="3.2"   cy="28" r="0.5" fill="#c8582a"/>
  <circle cx="78.08" cy="28" r="0.5" fill="#c8582a"/>

  <circle cx="16.00" cy="28" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>
  <circle cx="40.64" cy="28" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>
  <circle cx="65.28" cy="28" r="7.5" fill="none" stroke="#1c1b17" stroke-width="0.25"/>

  <circle cx="3.2"   cy="52" r="0.5" fill="#c8582a"/>
