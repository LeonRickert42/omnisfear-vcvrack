  <rect x="2" y="89.5" width="77.28" height="17.5" rx="1.2" ry="1.2" fill="#0d1219" opacity="0.55"/>
  <rect x="2" y="89.5" width="77.28" height="17.5" rx="1.2" ry="1.2" fill="none" stroke="#252a33" stroke-width="0.18"/>

  <circle cx="10.50" cy="97" r="5.2" fill="none" stroke="#2a3340" stroke-width="0.28"/>
